[project]
name = "document-rectifier"
version = "0.1.0"
description = "Interactive document rectification with OpenCV"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.2.5",
    "opencv-python>=4.11.0.86",
]

[project.scripts]
document-rectifier = "document_rectifier:main"

[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["document_rectifier"]

[tool.uv]
package = true